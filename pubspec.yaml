name: auto_rescue
description: Auto Rescue - Real-time roadside assistance platform
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  provider: ^6.1.5+1              # keep only one provider
  http: ^1.2.2
  flutter_map: ^8.3.0
  latlong2: ^0.9.1
  geolocator: ^14.0.2
  url_launcher: ^6.3.0
  web: ^1.1.1
  cupertino_icons: ^1.0.8

  firebase_core: ^4.7.0
  firebase_auth: ^6.4.0
  cloud_firestore: ^6.3.0
  firebase_storage: ^13.3.0
  firebase_messaging: ^16.2.0
  file_picker: ^11.0.2

  flutter_local_notifications: ^21.0.0
  audioplayers: ^6.1.0
  vibration: ^3.1.8
  shared_preferences: ^2.5.3
  pinput: ^5.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/logo/applogo.png
    - assets/sounds/alert.mp3
    - assets/sounds/admin_popup.ogg

flutter_launcher_icons:
  android: true
  image_path: assets/logo/applogo.png
  min_sdk_android: 21
  web:
    generate: true
    image_path: assets/logo/applogo.png
    background_color: "#0F172A"
    theme_color: "#2563EB"